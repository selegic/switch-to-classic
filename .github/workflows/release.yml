name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build:production

      - name: Verify package
        run: npm run verify-build

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./angular/src/manifest.json').version")
          echo "manifest version: $MANIFEST_VERSION"
          echo "tag version: ${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME#v}" = "$MANIFEST_VERSION" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the manifest version $MANIFEST_VERSION. Run 'npm run sync-version -- ${GITHUB_REF_NAME#v}' and commit before tagging."
            exit 1
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: extension-build.zip
          generate_release_notes: true
          body: |
            ## Installing

            Download `extension-build.zip`, unzip it, and load it as an
            unpacked extension in Chrome (`chrome://extensions` -> Developer
            mode -> Load unpacked), or install the published version from the
            [Chrome Web Store](https://chromewebstore.google.com/detail/selegic-switch-to-classic/ellmmiehdcccalmmdfpoeeablbpnihac).

            See [CHANGELOG.md](https://github.com/selegic/switch-to-classic/blob/main/CHANGELOG.md) for what changed.
