name: Bug report
description: A problem with the extension
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A short, clear description of the bug.
      placeholder: Clicking "Switch to Classic" on a record page opens the Classic home page but never the record.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open this page ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: See chrome://extensions, or the version in angular/src/manifest.json.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "chrome://version"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Where does it happen
      options:
        - Lightning record page
        - Lightning list view / tab
        - Lightning home or Setup
        - Extension popup (toolbar button)
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console / extension errors
      description: Output of chrome://extensions -> "Inspect views: service worker", and the page console.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Anything else
    validations:
      required: false
