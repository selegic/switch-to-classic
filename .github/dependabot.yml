# Dependabot
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Kolkata'
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
      tooling:
        patterns:
          - 'vite'
          - 'vitest'
          - 'typescript'
          - 'prettier'
          - 'rimraf'
          - 'concurrently'
          - 'bestzip'
    commit-message:
      prefix: 'chore(deps)'
